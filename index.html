<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>POS System - Quản Lý Bán Hàng</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  
  <style>
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes modalScale {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
    .animate-fade-in { animation: fadeIn 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .animate-modal { animation: modalScale 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

    /* STYLE KHI IN HÓA ĐƠN (CHỮ TO > 15px & FIX LỖI RỚT DÒNG TRÀN LỀ) */
    @media print {
      @page {
        size: 80mm auto;
        margin: 0;
      }
      body * { visibility: hidden; }
      #printable-receipt, #printable-receipt * { visibility: visible; }
      #printable-receipt {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        max-width: 80mm;
        padding: 8px;
        box-sizing: border-box;
        font-size: 16px !important; /* Size > 15px theo yêu cầu */
        color: #000 !important;
        word-break: break-word;
        overflow-wrap: break-word;
        white-space: normal;
      }
      #printable-receipt h2 { font-size: 24px !important; font-weight: bold; }
      #printable-receipt .receipt-title { font-size: 20px !important; }
      #printable-receipt table th, 
      #printable-receipt table td { font-size: 16px !important; padding: 6px 2px; }
      #printable-receipt .total-price { font-size: 22px !important; font-weight: bold; }
      #printable-receipt div, #printable-receipt p, #printable-receipt span {
        word-break: break-word;
        overflow-wrap: break-word;
      }
    }
  </style>
</head>
<body class="bg-slate-100 font-sans text-slate-800 antialiased h-screen flex flex-col overflow-hidden">

  <!-- TOP HEADER -->
  <header class="bg-white border-b border-slate-200 px-6 py-3 flex items-center justify-between shrink-0 shadow-sm z-10">
    <div class="flex items-center space-x-3">
      <div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center text-white text-xl font-bold shadow-md shadow-indigo-200">
        <i class="ph-bold ph-storefront"></i>
      </div>
      <div>
        <h1 id="header-store-name" class="font-bold text-slate-800 text-lg leading-tight">Cửa Hàng Của Tôi</h1>
        <p class="text-xs text-slate-500 flex items-center gap-2">
          <span id="header-store-phone"><i class="ph ph-phone"></i> ---</span> | 
          <span id="header-store-address"><i class="ph ph-map-pin"></i> ---</span>
        </p>
      </div>
    </div>

    <div class="flex items-center space-x-2">
      <button onclick="toggleStoreSettingsModal(true)" class="flex items-center space-x-2 px-3.5 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg text-sm font-medium transition active:scale-95">
        <i class="ph-bold ph-gear text-base text-slate-600"></i>
        <span>Cấu hình Cửa Hàng</span>
      </button>
    </div>
  </header>

  <!-- MAIN APP CONTAINER -->
  <div class="flex-1 flex overflow-hidden">
    <main class="flex-1 flex flex-col min-w-0 bg-slate-50">
      
      <!-- Toolbar -->
      <div class="p-4 bg-white border-b border-slate-200 flex flex-wrap gap-3 items-center justify-between shrink-0">
        <div class="flex bg-slate-100 p-1 rounded-xl text-sm font-semibold">
          <button id="tab-pos" onclick="switchTab('pos')" class="px-4 py-2 rounded-lg bg-white shadow-sm text-indigo-600 transition">Bán Hàng (POS)</button>
          <button id="tab-products" onclick="switchTab('products')" class="px-4 py-2 rounded-lg text-slate-600 hover:text-slate-900 transition">Sản Phẩm</button>
          <button id="tab-customers" onclick="switchTab('customers')" class="px-4 py-2 rounded-lg text-slate-600 hover:text-slate-900 transition">Khách Hàng</button>
        </div>

        <div class="relative min-w-[240px]">
          <i class="ph ph-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-lg"></i>
          <input type="text" id="pos-search" oninput="renderPosProducts()" placeholder="Tìm sản phẩm..." class="w-full pl-9 pr-4 py-2 bg-slate-100 border-none rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 outline-none transition">
        </div>
      </div>

      <!-- TAB CONTENT CONTAINER -->
      <div class="flex-1 overflow-y-auto p-4">
        
        <!-- SECTION 1: POS PRODUCTS GRID -->
        <div id="section-pos" class="animate-fade-in">
          <div id="pos-product-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3.5"></div>
        </div>

        <!-- SECTION 2: PRODUCTS MANAGEMENT -->
        <div id="section-products" class="hidden animate-fade-in">
          <div class="flex justify-between items-center mb-4">
            <h2 class="text-base font-bold text-slate-800">Danh Sách Sản Phẩm</h2>
            <button onclick="openProductModal()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-sm font-semibold shadow-sm transition active:scale-95 flex items-center gap-1.5">
              <i class="ph-bold ph-plus"></i> Thêm Sản Phẩm
            </button>
          </div>
          <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
            <table class="w-full text-left text-sm">
              <thead class="bg-slate-50 border-b border-slate-200 text-slate-500 font-semibold">
                <tr>
                  <th class="p-4">Tên Sản Phẩm</th>
                  <th class="p-4">Đơn Vị Tính</th>
                  <th class="p-4">Đơn Giá</th>
                  <th class="p-4 text-right">Thao Tác</th>
                </tr>
              </thead>
              <tbody id="product-table-body" class="divide-y divide-slate-100"></tbody>
            </table>
          </div>
        </div>

        <!-- SECTION 3: CUSTOMERS MANAGEMENT -->
        <div id="section-customers" class="hidden animate-fade-in">
          <div class="flex justify-between items-center mb-4">
            <h2 class="text-base font-bold text-slate-800">Danh Sách Khách Hàng</h2>
            <button onclick="openCustomerModal()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-sm font-semibold shadow-sm transition active:scale-95 flex items-center gap-1.5">
              <i class="ph-bold ph-plus"></i> Thêm Khách Hàng
            </button>
          </div>
          <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
            <table class="w-full text-left text-sm">
              <thead class="bg-slate-50 border-b border-slate-200 text-slate-500 font-semibold">
                <tr>
                  <th class="p-4">Họ & Tên</th>
                  <th class="p-4">Số Điện Thoại</th>
                  <th class="p-4 text-right">Thao Tác</th>
                </tr>
              </thead>
              <tbody id="customer-table-body" class="divide-y divide-slate-100"></tbody>
            </table>
          </div>
        </div>

      </div>
    </main>

    <!-- RIGHT PANEL: CART & CHECKOUT -->
    <aside class="w-80 lg:w-96 bg-white border-l border-slate-200 flex flex-col shrink-0 shadow-lg z-10">
      <div class="p-4 border-b border-slate-200 bg-slate-50/50">
        <div class="flex justify-between items-center mb-3">
          <h3 class="font-bold text-slate-800 text-base flex items-center gap-2">
            <i class="ph-bold ph-shopping-cart text-indigo-600"></i> Giỏ Hàng
          </h3>
          <button onclick="clearCart()" class="text-xs text-red-500 hover:underline">Xóa hết</button>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1">Khách hàng</label>
          <select id="cart-customer" class="w-full p-2.5 bg-white border border-slate-200 rounded-xl text-sm font-medium focus:ring-2 focus:ring-indigo-500 outline-none transition">
            <option value="">Khách Vãng Lai</option>
          </select>
        </div>
      </div>

      <!-- CART ITEMS LIST (Có nút Xóa / Chỉnh sửa SP trực tiếp) -->
      <div id="cart-items" class="flex-1 overflow-y-auto p-4 space-y-2.5"></div>

      <!-- CART SUMMARY -->
      <div class="p-4 border-t border-slate-200 bg-slate-50/80 space-y-3">
        <div class="flex justify-between items-center text-slate-600 text-sm">
          <span>Tổng tiền:</span>
          <span id="cart-total" class="font-black text-xl text-indigo-600">0 ₫</span>
        </div>
        <button onclick="checkout()" class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-700 active:scale-[0.98] text-white font-bold rounded-xl shadow-md shadow-indigo-200 transition flex items-center justify-center gap-2">
          <i class="ph-bold ph-receipt text-lg"></i> Xem & In Hóa Đơn
        </button>
      </div>
    </aside>
  </div>

  <!-- MODAL: SẢN PHẨM (Thêm / Sửa) -->
  <div id="product-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
    <div class="bg-white w-full max-w-md rounded-2xl shadow-xl border border-slate-100 overflow-hidden animate-modal">
      <div class="px-6 py-4 border-b border-slate-100 flex justify-between items-center">
        <h3 id="prod-modal-title" class="font-bold text-slate-800">Thêm Sản Phẩm Mới</h3>
        <button type="button" onclick="toggleProductModal(false)" class="text-slate-400 hover:text-slate-600"><i class="ph-bold ph-x text-lg"></i></button>
      </div>
      <form onsubmit="saveProduct(event)" class="p-6 space-y-4">
        <input type="hidden" id="prod-id">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Tên sản phẩm *</label>
          <input type="text" id="prod-name" required class="w-full p-2.5 border border-slate-200 rounded-xl text-sm outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Đơn vị tính</label>
            <input type="text" id="prod-unit" placeholder="Cái, Chai..." class="w-full p-2.5 border border-slate-200 rounded-xl text-sm outline-none focus:ring-2 focus:ring-indigo-500">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Giá bán (VNĐ) *</label>
            <input type="number" id="prod-price" required min="0" class="w-full p-2.5 border border-slate-200 rounded-xl text-sm outline-none focus:ring-2 focus:ring-indigo-500">
          </div>
        </div>
        <div class="pt-2 flex justify-end space-x-2">
          <button type="button" onclick="toggleProductModal(false)" class="px-4 py-2 bg-slate-100 text-slate-600 rounded-xl text-sm font-semibold hover:bg-slate-200">Hủy</button>
          <button type="submit" class="px-4 py-2 bg-indigo-600 text-white rounded-xl text-sm font-semibold hover:bg-indigo-700 shadow-sm">Lưu</button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL: KHÁCH HÀNG (Thêm / Sửa) -->
  <div id="customer-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
    <div class="bg-white w-full max-w-md rounded-2xl shadow-xl border border-slate-100 overflow-hidden animate-modal">
      <div class="px-6 py-4 border-b border-slate-100 flex justify-between items-center">
        <h3 id="cust-modal-title" class="font-bold text-slate-800">Thêm Khách Hàng Mới</h3>
        <button type="button" onclick="toggleCustomerModal(false)" class="text-slate-400 hover:text-slate-600"><i class="ph-bold ph-x text-lg"></i></button>
      </div>
      <form onsubmit="saveCustomer(event)" class="p-6 space-y-4">
        <input type="hidden" id="cust-id">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Tên khách hàng *</label>
          <input type="text" id="cust-name" required class="w-full p-2.5 border border-slate-200 rounded-xl text-sm outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Số điện thoại</label>
          <input type="text" id="cust-phone" class="w-full p-2.5 border border-slate-200 rounded-xl text-sm outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <div class="pt-2 flex justify-end space-x-2">
          <button type="button" onclick="toggleCustomerModal(false)" class="px-4 py-2 bg-slate-100 text-slate-600 rounded-xl text-sm font-semibold hover:bg-slate-200">Hủy</button>
          <button type="submit" class="px-4 py-2 bg-indigo-600 text-white rounded-xl text-sm font-semibold hover:bg-indigo-700 shadow-sm">Lưu Khách Hàng</button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL: THÔNG TIN CỬA HÀNG -->
  <div id="store-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
    <div class="bg-white w-full max-w-md rounded-2xl shadow-xl border border-slate-100 overflow-hidden animate-modal">
      <div class="px-6 py-4 border-b border-slate-100 flex justify-between items-center">
        <h3 class="font-bold text-slate-800 flex items-center gap-2"><i class="ph-bold ph-gear text-indigo-600"></i> Cấu Hình Cửa Hàng</h3>
        <button type="button" onclick="toggleStoreSettingsModal(false)" class="text-slate-400 hover:text-slate-600"><i class="ph-bold ph-x text-lg"></i></button>
      </div>
      <form onsubmit="saveStoreSettings(event)" class="p-6 space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Tên Cửa hàng / Công ty *</label>
          <input type="text" id="store-name-input" required class="w-full p-2.5 border border-slate-200 rounded-xl text-sm outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Số điện thoại</label>
          <input type="text" id="store-phone-input" class="w-full p-2.5 border border-slate-200 rounded-xl text-sm outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Địa chỉ</label>
          <input type="text" id="store-address-input" class="w-full p-2.5 border border-slate-200 rounded-xl text-sm outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <div class="pt-2 flex justify-end space-x-2">
          <button type="button" onclick="toggleStoreSettingsModal(false)" class="px-4 py-2 bg-slate-100 text-slate-600 rounded-xl text-sm font-semibold hover:bg-slate-200">Hủy</button>
          <button type="submit" class="px-4 py-2 bg-indigo-600 text-white rounded-xl text-sm font-semibold hover:bg-indigo-700 shadow-sm">Lưu Thay Đổi</button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL: XEM & IN HÓA ĐƠN (FONT CHỮ LỚN > 15PX) -->
  <div id="receipt-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
    <div class="bg-white w-full max-w-lg rounded-2xl shadow-2xl border border-slate-100 overflow-hidden flex flex-col max-h-[90vh] animate-modal">
      <div class="px-6 py-4 border-b border-slate-100 flex justify-between items-center bg-slate-50">
        <h3 class="font-bold text-slate-800 flex items-center gap-2 text-base"><i class="ph-bold ph-receipt text-indigo-600"></i> Hóa Đơn Thanh Toán</h3>
        <button type="button" onclick="toggleReceiptModal(false)" class="text-slate-400 hover:text-slate-600"><i class="ph-bold ph-x text-lg"></i></button>
      </div>
      
      <!-- Khung hiển thị nội dung hóa đơn để in -->
      <div class="p-6 overflow-y-auto flex-1">
        <div id="printable-receipt" class="space-y-4 font-mono text-base text-slate-800">
          <!-- Dynamic Content từ JS -->
        </div>
      </div>

      <div class="p-4 border-t border-slate-100 bg-slate-50 flex justify-end space-x-3">
        <button onclick="toggleReceiptModal(false)" class="px-5 py-2.5 bg-slate-200 text-slate-700 font-bold rounded-xl hover:bg-slate-300 transition">Đóng</button>
        <button onclick="window.print()" class="px-5 py-2.5 bg-indigo-600 text-white font-bold rounded-xl hover:bg-indigo-700 shadow-md transition flex items-center gap-2">
          <i class="ph-bold ph-printer text-lg"></i> In Hóa Đơn (Chữ To)
        </button>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
