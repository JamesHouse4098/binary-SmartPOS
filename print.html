<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>In Hóa Đơn</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-size: 16px; font-family: monospace; color: #000; }
    .total-price { font-size: 24px !important; font-weight: 900 !important; }
    @media print {
      @page { margin: 0; size: auto; }
      body { margin: 8px; }
    }
  </style>
</head>
<body class="p-4 bg-white">
  <div id="content"></div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const data = localStorage.getItem("POS_PRINT_DATA");
      if (data) {
        document.getElementById("content").innerHTML = data;
        setTimeout(() => {
          window.print();
          window.close();
        }, 300);
      } else {
        document.getElementById("content").innerHTML = "<p>Không tìm thấy dữ liệu hóa đơn!</p>";
      }
    });
  </script>
</body>
</html>
